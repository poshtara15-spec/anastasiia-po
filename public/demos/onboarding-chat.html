<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Onboarding Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Rethink+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    --ground: #f4f6f8; --surface: #ffffff; --surface-2: #f8fafc;
    --ink: #1c2024; --ink-2: #4a5160; --ink-3: #7d8593;
    --line: #e4e8ee; --line-2: #c8cfdd;
    --accent: #3d33ff; --accent-soft: #eeedff; --accent-ink: #2a22c4;
    --jade: #1a7f52; --jade-soft: #f0faf4;
    --red: #c5292e; --red-soft: #fdf3f3;
    --amber: #a8620c; --amber-soft: #fdf5e9;
    --code-bg: #14161c; --code-ink: #e6e8ee; --code-dim: #8b93a5;
    --bubble-user-ink: #1c2024;
    --frost: rgba(255,255,255,.6); --frost-line: #ffffff;
    --composer: rgba(251,253,255,.4);
    --g1: #f1f0ff; --g2: #e7f7ef;
    --shadow: 0 1px 2px rgba(17,24,39,.05), 0 16px 40px -28px rgba(17,24,39,.35);
    --lift: 0 1px 2px rgba(17,24,39,.04), 0 6px 16px -12px rgba(17,24,39,.28);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0d0f14; --surface: #161920; --surface-2: #1b1f27;
      --ink: #e9ebef; --ink-2: #a8b0be; --ink-3: #787f8e;
      --line: #262b34; --line-2: #343b47;
      --accent: #9a93ff; --accent-soft: #1f1c3d; --accent-ink: #b6b0ff;
      --jade: #4cc38a; --jade-soft: #102219;
      --red: #f0797d; --red-soft: #291416;
      --amber: #e0a43c; --amber-soft: #271d0e;
      --code-bg: #0a0c10; --code-ink: #e6e8ee; --code-dim: #7c8497;
      --bubble-user-ink: #e9ebef;
      --frost: rgba(255,255,255,.06); --frost-line: rgba(255,255,255,.14);
      --composer: rgba(20,23,30,.55);
      --g1: #16152b; --g2: #102320;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 40px -28px rgba(0,0,0,.9);
      --lift: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px -12px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0d0f14; --surface: #161920; --surface-2: #1b1f27;
    --ink: #e9ebef; --ink-2: #a8b0be; --ink-3: #787f8e;
    --line: #262b34; --line-2: #343b47;
    --accent: #9a93ff; --accent-soft: #1f1c3d; --accent-ink: #b6b0ff;
    --jade: #4cc38a; --jade-soft: #102219;
    --red: #f0797d; --red-soft: #291416;
    --amber: #e0a43c; --amber-soft: #271d0e;
    --code-bg: #0a0c10; --code-ink: #e6e8ee; --code-dim: #7c8497;
    --bubble-user-ink: #e9ebef;
    --frost: rgba(255,255,255,.06); --frost-line: rgba(255,255,255,.14);
    --composer: rgba(20,23,30,.55);
    --g1: #16152b; --g2: #102320;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 16px 40px -28px rgba(0,0,0,.9);
    --lift: 0 1px 2px rgba(0,0,0,.4), 0 6px 16px -12px rgba(0,0,0,.7);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    background: var(--ground);
    background-image: linear-gradient(135deg, var(--g1) 0%, var(--g2) 100%);
    background-attachment: fixed;
    font-family: "Rethink Sans", system-ui, -apple-system, sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  /* ---------- hero: one decision, on brand ---------- */
  /* Deliberately single-theme: this surface is the brand, indigo in both themes. */
  .hero {
    min-height: 100vh; display: grid; place-items: center;
    background: #ffffff; position: relative; overflow: hidden; padding: 56px 20px;
    transition: opacity .38s ease, transform .38s ease;
  }

  /* The brand gradient, pixelated into tiles. Each tile turns over on its own
     beat; the delay follows the diagonal, so the turn reads as one wave
     crossing the screen rather than 400 things twitching at once. */
  .cells {
    position: absolute; inset: 0; display: grid; gap: 4px;
    perspective: 1100px; pointer-events: none;
  }
  .cell {
    position: relative; border-radius: 12px; background: var(--c1);
    animation: turn 15s cubic-bezier(.62,.04,.3,1) infinite;
    animation-delay: var(--dl);
  }
  .cell.still { animation: none; }
  .cell i {
    position: absolute; right: -3px; top: -3px; width: 7px; height: 7px;
    transform: rotate(45deg); border-radius: 1px;
  }
  @keyframes turn {
    0%, 38%     { transform: rotateX(0deg);    background: var(--c1); }
    44%         { transform: rotateX(-90deg);  background: var(--c1); }
    44.01%      { background: var(--c2); }
    50%, 88%    { transform: rotateX(-180deg); background: var(--c2); }
    94%         { transform: rotateX(-270deg); background: var(--c2); }
    94.01%      { background: var(--c1); }
    100%        { transform: rotateX(-360deg); background: var(--c1); }
  }

  .hero.out { opacity: 0; transform: scale(.985); pointer-events: none; }

  .hero-in {
    position: relative; z-index: 1; width: 100%; max-width: 940px;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    text-align: center;
  }

  .brandpill {
    display: inline-flex; align-items: center; gap: 8px;
    color: #1c2024; font-weight: 600; font-size: 15px; letter-spacing: -.01em;
  }
  .brandmark { width: 22px; height: 22px; display: block; line-height: 0; }
  .brandmark svg { display: block; width: 100%; height: 100%; border-radius: 5px; }

  .hero h1 {
    margin: 22px 0 0; color: #0b1322; font-weight: 600; letter-spacing: -.035em;
    font-size: clamp(34px, 5.6vw, 54px); line-height: 1.06; text-wrap: balance;
  }
  /* the sub carries the same ink as the headline in this design, not a grey */
  .hero-sub {
    margin: 14px 0 0; color: #0b1322; font-size: 16.5px;
    max-width: 54ch; text-wrap: balance;
  }

  .picks {
    margin-top: 34px; width: 100%; max-width: 640px; margin-inline: auto;
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;
  }
  @media (max-width: 700px) { .picks { grid-template-columns: 1fr; } }

  /* White in both states; selection is the gradient stroke, not a fill. The
     Figma shadow is 0 2px 12px -18px \u2014 at that spread it renders as nothing
     in CSS (spread pulls the shadow in further than the blur pushes it back
     out), so the spread is opened up to -6px here to keep it visible. */
  .pick {
    font: inherit; text-align: left; cursor: pointer;
    border: 1px solid transparent; border-radius: 12px; padding: 16px;
    background:
      linear-gradient(#fff, #fff) padding-box,
      linear-gradient(97deg, transparent, transparent) border-box;
    display: flex; flex-direction: column; gap: 6px; position: relative;
    box-shadow: 0 2px 12px -6px rgba(23,18,79,.12);
    transition: box-shadow .16s ease, transform .16s ease, background .16s ease;
  }
  .pick:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px -8px rgba(23,18,79,.2);
  }

  /* Selection is carried by the mark, the tint and a deeper lift — never by a
     border, so it still reads without colour. */
  .pick[aria-checked="true"] {
    background:
      linear-gradient(#fff, #fff) padding-box,
      linear-gradient(97deg, #a7ccfc 0%, #f9cceb 100%) border-box;
    box-shadow: 0 6px 20px -8px rgba(23,18,79,.18);
  }
  /* RadioGroupItem from the design system, to the pixel: a 16px circle with a
     1px primary border, and a 10px filled primary dot as the indicator. */
  /* RadioGroupItem as the DS builds it: h-4 w-4, 1px primary border, and the
     indicator is lucide's Circle at h-2.5 w-2.5 with fill-current — an icon,
     not a CSS disc, so the edge matches the product exactly. */
  .pick .radio {
    position: absolute; top: 16px; right: 16px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 1px solid #3514ed; background: transparent;
    display: grid; place-items: center; color: #3514ed;
  }
  .pick .radio svg {
    width: 10px; height: 10px; display: block;
    opacity: 0; transform: scale(.3);
    transition: opacity .14s ease, transform .18s cubic-bezier(.2,.7,.3,1);
  }
  .pick[aria-checked="true"] .radio svg { opacity: 1; transform: none; }
  .pick:focus-visible { outline: 2px solid #3514ed; outline-offset: 3px; }
  .pick-ico { display: none; }
  .pick-t {
    font-size: 15.5px; font-weight: 600; color: #0b1322; letter-spacing: -.015em;
    padding-right: 26px;
  }
  .pick-d { font-size: 13px; color: #4a5160; line-height: 1.5; }

  .cta {
    margin-top: 17px; width: 100%; max-width: 644px; height: 46px;
    font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
    padding: 0 14px; border-radius: 8px; border: 0; background: #3514ed; color: #fff;
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .cta:disabled { opacity: .35; cursor: default; }
  .cta:hover:not(:disabled) { background: #2b10c9; }
  .cta span { transition: transform .16s ease; }
  .cta:hover:not(:disabled) span { transform: translateX(3px); }

  .askline {
    margin-top: 14px; font: inherit; font-size: 13px; cursor: pointer;
    background: none; border: 0; color: #8a90a2; padding: 0 0 1px;
    border-bottom: 1px solid transparent;
  }
  .askline:hover { color: #4a5160; border-bottom-color: #c8cfdd; }

  .hero-ask { margin-top: 14px; width: 100%; max-width: 640px; display: flex; gap: 8px; }
  .hero-ask[hidden] { display: none; }
  .hero-ask input {
    flex: 1; font: inherit; font-size: 14.5px; color: #10121a;
    background: #fff; border: 1px solid #dfe3ec; border-radius: 9px; padding: 12px 15px;
  }
  .hero-ask input::placeholder { color: #9aa0b0; }
  .hero-ask input:focus { outline: none; border-color: #3d33ff; }
  .hero-ask button {
    font: inherit; font-size: 17px; line-height: 1; cursor: pointer; flex: none;
    width: 46px; border-radius: 9px; border: 0; background: #3d33ff; color: #fff; font-weight: 600;
  }
  .hero-ask button:disabled { opacity: .35; cursor: default; }
  .hero-ask.busy input { opacity: .6; }

  .hero-skip {
    margin-top: 20px; font: inherit; font-size: 13.5px; cursor: pointer;
    background: none; border: 0; color: #5e6573;
    border-bottom: 1px solid transparent; padding: 0 0 1px;
  }
  .hero-skip:hover { color: #0b1322; border-bottom-color: #c8cfdd; }

  @media (prefers-reduced-motion: reduce) {
    .hero, .pick { transition: none; }
    .cell { animation: none; }
  }


  /* ---------- claim dialog, mirroring the app's own ClaimFreeCreditsDialog ---------- */
  .ovl {
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px;
    background: rgba(17,19,28,.55); backdrop-filter: blur(3px);
    animation: fade .18s ease;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .dlg {
    width: 96vw; max-width: 860px; border-radius: 20px; overflow: hidden;
    display: grid; grid-template-columns: 1fr 1fr;
    box-shadow: 0 30px 80px -30px rgba(10,10,30,.7);
    animation: pop .2s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: none; } }
  @media (max-width: 760px) { .dlg { grid-template-columns: 1fr; max-height: 90vh; overflow-y: auto; } }

  /* left — value. Fixed light gradient, exactly as the app ships it. */
  .dlg-l {
    background: linear-gradient(180deg, #F1F0FF 0%, #E7F7EF 100%);
    padding: 28px; display: flex; flex-direction: column; color: #1c2024;
  }
  .dlg-eyebrow { display: inline-flex; align-items: center; gap: 6px; color: #3d33ff; font-size: 14px; font-weight: 600; }
  .dlg-l h2 { margin: 12px 0 0; font-size: 24px; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; }
  .dlg-l h2 b { color: #3d33ff; font-weight: 800; }
  .dlg-l .lede { margin: 8px 0 0; font-size: 14px; color: #4a5160; line-height: 1.6; }
  .dlg-l ul { list-style: none; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .dlg-l li { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; }
  .dlg-l li svg { flex: none; margin-top: 2px; }
  .dlg-l li b { font-weight: 600; }
  .dlg-l .cap {
    margin-top: 20px; font-size: 11px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: #6b7280;
  }
  .brandrow { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .brandtile {
    width: 32px; height: 32px; border-radius: 8px; background: #fff; border: 1px solid #e4e8ee;
    display: grid; place-items: center; font-size: 12px; font-weight: 600; color: #1c2024;
  }
  .dlg-l .unlock { margin: 8px 0 0; font-size: 13px; color: #4a5160; }
  .trust { margin-top: auto; padding-top: 24px; display: flex; align-items: center; gap: 10px; }
  .faces { display: flex; }
  .faces span {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; margin-left: -8px;
    display: grid; place-items: center; font-size: 10px; font-weight: 600; color: #fff;
  }
  .faces span:first-child { margin-left: 0; }
  .stars { display: flex; gap: 1px; }
  .trust .who { font-size: 12px; font-weight: 600; }

  /* right — verification */
  .dlg-r { background: var(--surface); padding: 28px; display: flex; flex-direction: column; }
  .dlg-r h3 { margin: 0; font-size: 15px; font-weight: 600; color: var(--ink); }
  .safebox {
    margin-top: 16px; display: flex; align-items: flex-start; gap: 10px;
    border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 14px;
  }
  .safebox p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--ink-3); }
  .safebox b { color: var(--ink); font-weight: 600; }
  .cardfield {
    margin-top: 16px; display: flex; flex-direction: column; gap: 8px;
  }
  .cardfield label { font-size: 12.5px; color: var(--ink-3); }
  .cardfield .fake {
    border: 1px solid var(--line-2); border-radius: 10px; padding: 12px 13px;
    background: var(--surface-2); color: var(--ink-3); font-size: 14px;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .cardfield .note { font-size: 11.5px; color: var(--ink-3); }
  .claimbtn {
    margin-top: 20px; width: 100%; font: inherit; font-size: 15px; font-weight: 600;
    padding: 14px; border-radius: 11px; border: 0; background: var(--accent); color: #fff; cursor: pointer;
  }
  .claimbtn:disabled { opacity: .6; cursor: default; }
  .dlg-foot {
    margin-top: 12px; text-align: center; font-size: 12px; color: var(--ink-3);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .dlg-x {
    position: absolute; top: 14px; right: 16px; font: inherit; font-size: 20px; line-height: 1;
    background: none; border: 0; color: rgba(255,255,255,.8); cursor: pointer;
  }
  .dlg-x:hover { color: #fff; }

  .app { background: var(--surface); display: grid; grid-template-rows: 1fr; height: 100vh; }

  .after { max-width: 1140px; margin: 0 auto; padding: 30px 20px 48px; }

  .bar {
    grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between;
    padding: 13px 20px; border-bottom: 1px solid var(--line); background: var(--surface-2);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 14px; letter-spacing: -.01em; }
  .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--accent); }
  .escape {
    font: inherit; font-size: 13px; color: var(--ink-3); cursor: pointer;
    background: none; border: 0; border-bottom: 1px solid transparent; padding: 0;
  }
  .escape:hover { color: var(--ink-2); border-bottom-color: var(--line-2); }

  .chat {
    display: flex; flex-direction: column; min-width: 0; min-height: 0;
    background-image: linear-gradient(150deg, var(--g1) 0%, var(--g2) 100%);
  }
  /* the conversation keeps a readable measure however wide the window gets */
  /* The transcript sits at the bottom and older turns ride upward as new ones
     arrive. margin-top:auto on the inner block rather than justify-content:
     flex-end on the scroller — that one clips the top once it overflows. */
  .stream {
    flex: 1; min-height: 0; overflow-y: auto; padding: 30px 28px 10px;
    display: flex; flex-direction: column;
    width: 100%; max-width: 900px; margin-inline: auto;
  }
  .streamin { margin-top: auto; display: flex; flex-direction: column; gap: 15px; }
  .composer > * { width: 100%; max-width: 844px; margin-inline: auto; }
  .row { display: flex; gap: 11px; align-items: flex-start; animation: slidein .32s cubic-bezier(.2,.7,.3,1); }
  .row.me { justify-content: flex-end; }
  @keyframes slidein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .av {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    margin-top: 1px; overflow: hidden; line-height: 0;
    transform-origin: 50% 82%;
    box-shadow: 0 1px 3px rgba(17,24,39,.22);
  }
  .av svg { display: block; width: 100%; height: 100%; }
  .av.you {
    background: var(--accent); color: #fff; border-radius: 8px;
    display: grid; place-items: center; line-height: 1;
    font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
    box-shadow: none;
  }
  /* the mark tips from side to side while the answer is being written */
  @keyframes tumble {
    0%   { transform: rotate(0deg) translateY(0); }
    25%  { transform: rotate(-10deg) translateY(-1.5px); }
    50%  { transform: rotate(0deg) translateY(0); }
    75%  { transform: rotate(10deg) translateY(-1.5px); }
    100% { transform: rotate(0deg) translateY(0); }
  }
  .av.typing { animation: tumble 2s ease-in-out infinite; }

  /* No plates: a message is text on the gradient, with the mark standing in
     for the speaker. Anything with its own surface — a card, a model row, the
     credentials — brings it along. */
  .bubble {
    background: none; border: 0; border-radius: 0;
    padding: 2px 0 0; max-width: 78%; display: flex; flex-direction: column; gap: 10px; min-width: 0;
    font-size: 16px; line-height: 24px;
  }
  .bubble > * { transition: opacity .32s ease, transform .32s ease; }
  .bubble > .rise { opacity: 0; transform: translateY(7px); }

  /* Terminal-style printing: the whole line is laid out from the start and
     stays put — only the block cursor advances across it, so nothing reflows
     and no word ever jumps to another line mid-print. */
  .tw-rest { visibility: hidden; }
  /* the block cursor sits on the gradient now, so the character under it is
     hidden rather than painted in a plate colour */
  .tw-cur { background: var(--accent); color: transparent; border-radius: 1px; }

  .dots { display: inline-flex; gap: 4px; align-items: center; height: 18px; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); animation: bob 1.1s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes bob { 0%, 60%, 100% { opacity: .3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  @media (prefers-reduced-motion: reduce) {
    .chip { animation: none; opacity: 1; transform: none; }
    .row { animation: none; }
    .av.typing { animation: none; }
    .dots i { animation: none; opacity: .5; }
  }
  .row.me .bubble {
    color: var(--bubble-user-ink); max-width: 72%; text-align: right;
  }
  .bubble p { margin: 0; }
  .closingline { margin: 0; color: var(--ink); }
  .bubble .ask { color: var(--ink); }
  .bubble .sub { font-size: 16px; line-height: 24px; color: var(--ink); }

  .receipt {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 10.5px; color: var(--ink-3); display: flex; gap: 7px; align-items: center; flex-wrap: wrap;
  }
  .receipt .pulse { width: 5px; height: 5px; border-radius: 50%; background: var(--jade); }

  .card {
    border: 1px solid var(--line); background: var(--surface-2);
    border-radius: 8px; padding: 11px 13px; display: flex; flex-direction: column; gap: 5px;
  }
  .card .t { font-size: 14px; line-height: 21px; font-weight: 600; color: var(--ink); }
  .card .d { font-size: 14px; line-height: 21px; color: var(--ink-2); }
  .card.jade { background: var(--jade-soft); border-color: color-mix(in srgb, var(--jade) 28%, transparent); }
  .card.jade .t { color: var(--jade); }
  .card.amber { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 30%, transparent); }
  .card.amber .t { color: var(--amber); }
  .card.red { background: var(--red-soft); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
  .card.red .t { color: var(--red); }

  /* model picker — wide rows, composed left to right: what the $10 buys, what
     it is, what it costs. The number stays the first thing read. */
  .models { display: flex; flex-direction: row; flex-wrap: wrap; gap: 9px; }
  .models .mcard { flex: 1 1 220px; min-width: 0; }

  .mcard {
    font: inherit; text-align: left; cursor: pointer;

  var queue = [], playing = false;

  function bot(build) { queue.push({ k: "b", build: build }); if (!playing) drain(); }
  function say(text) { bot(function (b) { b.appendChild(el("p", null, text)); }); }
  function block(build, hold) { queue.push({ k: "n", build: build, hold: hold || 260 }); if (!playing) drain(); }

  function drain() {
    if (!queue.length) { playing = false; composer.classList.remove("busy"); return; }
    playing = true; composer.classList.add("busy");
    var item = queue.shift();

    if (item.k === "n") {
      var node = item.build();
      // options carry their own staggered entrance; anything else fades in whole
      var staggered = node.classList.contains("chips");
      if (!staggered) node.classList.add("rise");
      streamIn.appendChild(node);
      scroll();
      if (!staggered) requestAnimationFrame(function () { node.classList.remove("rise"); });
      setTimeout(drain, item.hold);
      return;
    }

    var build = item.build;
    var row = el("div", "row"); var av = avatar(); var b = el("div", "bubble");
    row.appendChild(av); row.appendChild(b);
    streamIn.appendChild(row);
    build(b);
    scroll();
    av.classList.add("typing");
    typeBubble(b, function () {
      av.classList.remove("typing");
      setTimeout(drain, 170);
    });
  }

  function typeBubble(b, done) {
    var kids = Array.prototype.slice.call(b.children);
    var jobs = [];
    // Every paragraph is split into shown / cursor / hidden-rest up front, so
    // the bubble is at its final height before a single character prints —
    // nothing below it ever shifts while the text arrives.
    kids.forEach(function (k) {
      if (k.tagName === "P") {
        var txt = k.textContent;
        var shown = el("span");
        var cur = el("span", "tw-cur");
        var rest = el("span", "tw-rest", txt);
        k.textContent = "";
        k.appendChild(shown); k.appendChild(cur); k.appendChild(rest);
        jobs.push({ el: k, txt: txt, shown: shown, cur: cur, rest: rest });
      } else {
        k.classList.add("rise");
      }
    });

    if (REDUCED) {
      jobs.forEach(function (j) { j.el.textContent = j.txt; });
      kids.forEach(function (k) { k.classList.remove("rise"); });
      done(); return;
    }

    // Steady characters-per-second, driven off the frame clock rather than a
    // fixed chunk size — the same rate on any machine, like output arriving
    // over a connection.
    var CPS = 165;

    function printLine(j, after) {
      var txt = j.txt, n = -1, t0 = null;
      function frame(ts) {
        if (t0 === null) t0 = ts;
        var target = Math.min(txt.length, Math.floor((ts - t0) / 1000 * CPS));
        if (target !== n) {
          n = target;
          j.shown.textContent = txt.slice(0, n);
          j.cur.textContent = n < txt.length ? txt.charAt(n) : "";
          j.rest.textContent = txt.slice(n + 1);
        }
        if (n < txt.length) requestAnimationFrame(frame);
        else { j.el.textContent = txt; after(); }
      }
      requestAnimationFrame(frame);
    }

    var i = 0;
    function nextLine() {
      if (i >= jobs.length) { revealRest(); return; }
      printLine(jobs[i++], function () { setTimeout(nextLine, 110); });
    }

    function revealRest() {
      var rest = kids.filter(function (k) { return k.tagName !== "P"; });
      rest.forEach(function (k, idx) {
        setTimeout(function () { k.classList.remove("rise"); scroll(); }, idx * 70);
      });
      setTimeout(done, rest.length * 70 + 140);
    }

    nextLine();
  }

  function thinking() {
    composer.classList.add("busy");
    var row = el("div", "row"); var av = avatar(); av.classList.add("typing");
    var b = el("div", "bubble");
    var d = el("div", "dots");
    d.appendChild(el("i")); d.appendChild(el("i")); d.appendChild(el("i"));
    b.appendChild(d);
    row.appendChild(av); row.appendChild(b);
    streamIn.appendChild(row); scroll();
    return row;
  }

  function me(text) {
    var row = el("div", "row me"); var b = el("div", "bubble");
    b.appendChild(el("p", null, text));
    row.appendChild(b);
    row.appendChild(el("div", "av you", "You"));
    streamIn.appendChild(row); scroll();
  }
  function receipt(b, ms, what) {
    var r = el("div", "receipt");
    r.appendChild(el("span", "pulse"));
    r.appendChild(el("span", null, "via llmapi.ai · " + what + " · " + ms + "ms"));
    b.appendChild(r);
  }
  function card(b, tone, title, detail) {
    var c = el("div", "card" + (tone ? " " + tone : ""));
    c.appendChild(el("div", "t", title));
    if (detail) c.appendChild(el("div", "d", detail));
    b.appendChild(c);
    return c;
  }

  /* ---------------- composer ---------------- */

  var isMulti = false;
  var typedAsChip = false;

  function chipEl(it, pressed, multi, onPick) {
    var c = el("button", "chip" + (it.free ? " free" : "") + (multi ? "" : " one"));
    // a typed answer can still be the answer even on a multi-select step
    c.type = "button";
    if (multi) {
      var bx = el("span", "box");
      bx.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"'
        + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M20 6 9 17l-5-5"/></svg>';
      c.appendChild(bx);
    }
    if (it.icon) { var ic = el("span", "ic"); ic.innerHTML = it.icon; c.appendChild(ic); }
    else if (it.em) c.appendChild(el("span", "em", it.em));
    var lb = el("span", "label", it.label);
    // the examples live under the label, so the option reads at a glance and
    // nobody has to know what "Cline" is before ticking
    if (it.sub) lb.appendChild(el("span", "sub", it.sub));
    c.appendChild(lb);
    if (!multi) {
      var rd = el("span", "radio");
      rd.appendChild(document.createElement("i"));
      c.appendChild(rd);
    }
    c.setAttribute("aria-pressed", pressed ? "true" : "false");
    c.addEventListener("click", function () {
      if (!multi) {
        picked = [it];
        var host = c.parentNode;
        Array.prototype.forEach.call(host.children, function (x) { x.setAttribute("aria-pressed", "false"); });
        c.setAttribute("aria-pressed", "true");
        send.disabled = false;
        return;
      }
      var was = c.getAttribute("aria-pressed") === "true";
      c.setAttribute("aria-pressed", was ? "false" : "true");
      if (was) picked = picked.filter(function (x) { return x.v !== it.v; });
      else picked.push(it);
      // a typed chip that is unticked has served its purpose
      if (was && it.free) { c.remove(); }
      send.disabled = picked.length === 0;
    });
    return c;
  }

  function setChips(items, multi, preselected, onPick, oneCol, cols) {
    picked = [];
    isMulti = !!multi;
    typedAsChip = !!multi;
    chipsEl = null;
    if (!items || !items.length) return;
    (items || []).forEach(function (it) {
      if (multi && preselected && preselected.indexOf(it.v) > -1) picked.push(it);
    });
    send.disabled = multi ? picked.length === 0 : true;
    // a single answer commits through Continue, like every other step
    if (!multi) send.onclick = function () { if (picked.length) onPick(picked[0]); };
    // queued, so the options land after the question has finished writing
    block(function () {
      var cls = cols ? "chips rowfix" : "chips" + (multi && !oneCol ? "" : " one");
      var host = el("div", cls);
      if (cols) host.style.setProperty("--cols", cols);
      chipsEl = host;
      items.forEach(function (it, i) {
        var on = multi && picked.some(function (x) { return x.v === it.v; });
        var c = chipEl(it, on, multi, onPick);
        if (oneCol) c.classList.add("one");
        c.style.setProperty("--i", i);
        host.appendChild(c);
      });
      return host;
    }, items.length * 55 + 300);
  }

  // Anything they type becomes a ticked chip alongside the offered ones, so the
  // free answer travels the same path as a tapped one.
  function addTyped(label) {
    var it = { v: "free:" + label.toLowerCase(), label: label, free: true };
    if (picked.some(function (x) { return x.v === it.v; })) return;
    picked.push(it);
    if (chipsEl) chipsEl.appendChild(chipEl(it, true, true, null));
    send.disabled = false;
  }

  function mode(kind, placeholder) {
    // kind: "none" | "confirm" | "both"
    inputrow.hidden = kind === "none";
    box.hidden = kind !== "both";
    if (kind === "both") {
      box.value = "";
      if (!isMulti) send.disabled = true;
      box.placeholder = placeholder || "Something else? Type it and press Enter.";
      box.style.height = "44px";
    }
    send.textContent = "Continue";
  }

  // Per-step skip: never silent — every skip states the default it fell back to.
  var stepSkip = null;
  function setSkip(fn, label) {
    stepSkip = fn || null;
    skipBtn.hidden = !fn;
    if (fn) skipBtn.textContent = label || "Skip this step";
  }

  /* ---------------- classification ---------------- */

  var PROMPT =
    "Classify one sentence from a developer signing up to an LLM gateway.\n" +
    "Reply with ONLY a JSON object with exactly these fields:\n" +
    '{"mode":"solo"|"team"|"org","building":string,"vertical":string|null,' +
    '"modalities":string[],"routes":string[],"role":string|null}\n' +
    'modalities from: chat, coding, imagevid, extract, research, speech. ' +
    '"extract" = reading images or documents; "research" = needs the live web; ' +
    '"imagevid" = generating pictures or video. Always include "chat" unless clearly media-only.\n' +
    'routes = where their API calls go TODAY, from: openai, anthropic, azure, bedrock, google, openrouter, local. Empty array if not stated.\n' +
    'mode: solo for one person, team for 2-20, org for a company or governance needs.\n' +
    '"building" is at most 6 words, English, naming the thing.\n' +
    '"role" is their own part in it, at most 3 words ("solo founder", "backend engineer", "CTO"), null if not stated.\n\nSentence:\n';

  function guess(text) {
    var t = text.toLowerCase();
    var m = /\b(we|our|us|team|company)\b/.test(t) ? "team" : "solo";
    if (/\borg|organi[sz]ation|compliance|security team|several teams\b/.test(t)) m = "org";
    var mods = ["chat"];
    if (/vision|image.*understand|ocr|screenshot|photo|invoice|receipt|pdf/.test(t)) mods.push("extract");
    if (/speech|voice|tts|stt|audio|read aloud/.test(t)) mods.push("speech");
    if (/generate image|illustration|\bart\b|video/.test(t)) mods.push("imagevid");
    if (/search|browse|\bweb\b|research|up.to.date/.test(t)) mods.push("research");
    if (/\bcod(e|ing)\b|programm|repo|refactor|pull request/.test(t)) mods.push("coding");
    var rs = [];
    if (/openrouter/.test(t)) rs.push("openrouter");
    if (/bedrock/.test(t)) rs.push("bedrock");
    if (/azure/.test(t)) rs.push("azure");
    if (/vertex|ai studio|gemini/.test(t)) rs.push("google");
    if (/ollama|llama\.cpp|self-host|locally/.test(t)) rs.push("local");
    if (/openai|gpt/.test(t) && rs.indexOf("azure") < 0) rs.push("openai");
    if (/anthropic|claude/.test(t) && rs.indexOf("bedrock") < 0) rs.push("anthropic");
    return { mode: m, building: text.trim().split(/\s+/).slice(0, 6).join(" "), modalities: mods, routes: rs };
  }

  // Unused while the hero has no free-text entry. One input and one call
  // bring the whole inference path back.
  async function classify(text) {
    if (!sampleFn) return { d: guess(text), ms: 0, real: false };
    var t0 = Date.now();
    try {
      var d = await sampleFn.json(PROMPT + text, { modelTier: "quick", cache: false });
      return { d: d, ms: Date.now() - t0, real: true };
    } catch (e) { return { d: guess(text), ms: Date.now() - t0, real: false }; }
  }

  // The local fallback answers instantly — too fast for the "thinking" avatar
  // to ever be seen spinning. Floor every wait at this, so the icon always gets
  // a beat on screen, real classifier or not.
  function minDelay(promise, ms) {
    var wait = new Promise(function (resolve) { setTimeout(resolve, ms); });
    return Promise.all([promise, wait]).then(function (r) { return r[0]; });
  }

  /* ---------------- steps ---------------- */

  function go(id) {
    stepId = id;
    setSkip(null);
    box.oninput = null;
    Array.prototype.forEach.call(streamIn.querySelectorAll(".chips"), function (n) { n.remove(); });
    STEPS[id]();
  }

  var STEPS = {};

  /* --- the hero hands off to the chat --- */

  var hero = document.getElementById("hero");
  var app = document.querySelector(".app");

  function openChat(echo, d, res) {
    hero.classList.add("out");
    setTimeout(function () {
      hero.hidden = true;
      app.hidden = false;
      afterClassify(d, res);
    }, 380);
  }

  function afterClassify(d, res) {
    // Two cards, so two branches: alone, or with anyone else at all. A second
    // person is what makes a project and a grant necessary — nothing between.
    S.branch = d.mode === "solo" ? "solo" : "org";
    S.mode = d.modeLabel || { solo: "Just me", team: "A few of us", org: "A whole organization" }[d.mode] || "Just me";
    if (d.building) S.building = d.building;
    S._mods = (d.modalities && d.modalities.length ? d.modalities : ["chat"]);
    S._routes = d.routes || [];
    renderFacts(S.building ? "building" : "mode");

    bot(function (b) {
      if (S.building) b.appendChild(el("p", null, "Got it — " + S.building + "."));
      // Branch-specific welcome: what this is for, and what it will cost them.
      b.appendChild(el("p", null, S.branch === "org"
        ? "Welcome. I am here to help you quickly set up your organization."
        : "Welcome. I am here to help you pick the best model to try our API on."));
      if (res) receipt(b, res.ms, res.real ? "classifier · quick" : "local fallback");
    });
    say(S.branch === "org"
      ? "A couple of quick ones, and you\u2019re set."
      : "Three short questions, and I can do that.");

    // The task comes first: it is the one answer the model recommendation
    // actually turns on, so it opens the flow rather than following the plumbing.
    // (Team accounts skip straight past it \u2014 see STEPS.needs.)
    go("needs");
  }

  /* --- both branches --- */

  // Where the key ends up, not what they are building. This is the only question
  // here we can pay back in the same session: it orders the paste dialog at the
  // end of the flow.
  // The fork developers themselves reach for on a call: "for coding, or for
  // the API" — not a flat list of three equal ways in. Coding tools and
  // agents both write code FOR you; calling the API directly is a different
  // track, and that's the only one where "prototype vs already live" means
  // anything.
  var INTRO_TRACK = [
    { v: "coding", label: "For coding", sub: "an assistant or tool that writes code for you" },
    { v: "api",    label: "For my API", sub: "calling LLM API directly inside your product" }
  ];

  // Claude Code is off this list on purpose: it speaks the Anthropic shape,
  // not the OpenAI-compatible one every tab in the setup dialog hands over.
  var SEEDS_CODING = [
    { v: "tool",  label: "A coding tool", sub: "Cursor, Cline, Continue" },
    { v: "agent", label: "Agent",         sub: "Hermes, OpenClaw, etc" }
  ];

  var MATURITY = [
    { v: "explore", label: "Just exploring", sub: "prototype, my own testing" },
    { v: "live",    label: "Already live",   sub: "real users, real data" }
  ];

  // Team accounts run role \u2192 org name \u2192 team size \u2192 concerns \u2192 plugging in;
  // solo keeps needs \u2192 intro \u2192 role \u2192 model.
  function nextAfterNeeds() { go(S.branch === "org" ? "role" : "intro"); }
  function nextAfterIntro() {
    if (S.branch === "org") {
      say("Hold on a second \u2014 I'm setting up your organization.");
      block(function () {
        var wrap = el("div", "miniloader");
        wrap.appendChild(el("div", "miniloader-ring"));
        var num = el("div", "miniloader-num", "3");
        wrap.appendChild(num);
        var left = 3;
        var t = setInterval(function () {
          left -= 1;
          if (left <= 0) { clearInterval(t); wrap.remove(); return; }
          num.textContent = String(left);
        }, 1000);
        return wrap;
      }, 3000);
      go("orgDone");
      return;
    }
    go("role");
  }
  function nextAfterRole() { go(S.branch === "org" ? "orgName" : "model"); }

  var ROLES = [
    ["dev", "Developer"],
    ["lead", "Engineering lead"],
    ["founder", "Founder / CTO"],
    ["ml", "ML / AI engineer"],
    ["product", "Product / Ops"]
  ].map(function (x) { return { v: x[0], label: x[1] }; });

  // One line whatever the role: it hands off to the last thing we need rather
  // than commenting on who they are.

  // A role already named in their own sentence does not get asked again.
  function roleFromText(t) {
    t = (t || "").toLowerCase();
    if (!t) return null;
    if (/founder|cto|ceo|owner/.test(t)) return "founder";
    if (/lead|head of|vp |manager|principal/.test(t)) return "lead";
    if (/\bml\b|machine learning|ai engineer|data scien/.test(t)) return "ml";
    if (/product|ops|devops|\bpm\b/.test(t)) return "product";
    if (/engineer|developer|backend|frontend|full.?stack|\bdev\b/.test(t)) return "dev";
    return null;
  }

  STEPS.role = function () {
    var known = roleFromText(S.role);
    if (known) {
      S.roleKey = known;
      nextAfterRole();
      return;
    }
    say("And what is your role?");
    setChips(ROLES, false, null, function (it) {
      me(it.label);
      S.role = it.label;
      S.roleKey = it.v;
      renderFacts("role");
      nextAfterRole();
    }, false, 2);
    typedAsChip = false;
    mode("both", "Or just tell me \u2014 \u201cI run growth at a 10-person startup\u201d");
    hint.textContent = "Pick one, or type it and I will continue with that.";

    // Typing is an answer too, so it clears whichever chip was tapped \u2014
    // last action wins, same rule the model step uses.
    box.oninput = function () {
      if (box.value.trim() && chipsEl) {
        Array.prototype.forEach.call(chipsEl.children, function (x) {
          x.setAttribute("aria-pressed", "false");
        });
        picked = [];
      }
      send.disabled = box.value.trim().length === 0 && picked.length === 0;
    };

    send.onclick = function () {
      if (picked.length) {
        me(picked[0].label);
        S.role = picked[0].label;
        S.roleKey = picked[0].v;
        renderFacts("role");
        nextAfterRole();
        return;
      }
      var text = box.value.trim();
      if (!text) return;
      me(text);
      box.value = "";
      S.role = text;
      S.roleKey = roleFromText(text) || "other";
      renderFacts("role");
      nextAfterRole();
    };

    setSkip(function () {
      me("Skipped");
      say("Then I will assume you are the one writing the code.");
      S.roleKey = "dev";
      nextAfterRole();
    });
  };


  STEPS.intro = function () {
    say("Is this for coding, or for your API?");
    // Single-select on purpose: developers themselves describe this as a
    // fork, not a checklist \u2014 "for coding" (an assistant writes code for
    // you) vs "for the API" (you call it directly). Only the second branch
    // ever asks about prototype vs already-live, so keeping them separate
    // is what makes that question answerable at all.
    setChips(INTRO_TRACK, false, null, null, true);
    typedAsChip = false;   // a typed sentence goes to the classifier, not into a chip
    mode("both", "Or describe your setup \u2014 \u201cZed, and an n8n agent on top\u201d");
    hint.textContent = "Pick the one that fits best.";

    setSkip(function () {
      me("Skipped");
      say("No matter \u2014 you will get all three ways in at the end anyway.");
      nextAfterIntro();
    });

    send.onclick = async function () {
      if (picked.length) {
        me(picked[0].label);
        S.introTrack = picked[0].v;
        go(picked[0].v === "coding" ? "introCoding" : "introApi");
        return;
      }

      var text = box.value.trim();
      if (!text) return;
      me(text);
      box.value = "";
      setChips([], false); mode("none"); setSkip(null);
      var t = thinking();
      var res = await minDelay(classify(text), 650);
      t.remove();
      var d = res.d || {};
      S.building = d.building || text.slice(0, 44);
      var guessedRole = !S.role && d.role ? d.role : null;
      if (guessedRole) S.role = guessedRole;
      if (d.routes && d.routes.length) S._routes = d.routes;
      renderFacts("building");
      bot(function (b) {
        var line = "Got it \u2014 " + S.building + ".";
        if (guessedRole) line += " And you are the " + guessedRole + " on it.";
        b.appendChild(el("p", null, line));
        receipt(b, res.ms, res.real ? "classifier \u00b7 quick" : "local fallback");
      });
      nextAfterIntro();
    };
  };

  // --- "for coding" branch: which tool actually writes it ---
  STEPS.introCoding = function () {
    say("Which one?");
    // Multi-select: using Cursor and also running an agent on top is one
    // person, not two \u2014 forcing a single pick would throw the second
    // answer away.
    setChips(SEEDS_CODING, true, null);
    mode("confirm");
    hint.textContent = "Tick everything that fits.";

    setSkip(function () {
      me("Skipped");
      nextAfterIntro();
    });

    send.onclick = function () {
      var labels = picked.map(function (x) { return x.label; });
      me(labels.join(" \u00b7 "));
      S.building = labels.join(", ");
      S._seeds = picked.map(function (x) { return x.v; });
      renderFacts("building");
      nextAfterIntro();
    };
  };

  // --- "for your API" branch: the only place prototype vs live means
  // anything, because it's the only track where the call actually ships
  // inside your own product. ---
  STEPS.introApi = function () {
    S._seeds = ["code"];

    say("Just exploring, or already live?");
    setChips(MATURITY, false, null, null, true);
    mode("confirm");
    hint.textContent = "Pick one.";

    setSkip(function () {
      me("Skipped");
      S.maturity = "Just exploring";
      S.building = "Prototype, calling the API directly";
      renderFacts("maturity");
      nextAfterIntro();
    });

    send.onclick = function () {
      if (!picked.length) return;
      me(picked[0].label);
      S.maturity = picked[0].label;
      S.building = (picked[0].v === "live" ? "Live product" : "Prototype") + ", calling the API directly";
      renderFacts("maturity");
      nextAfterIntro();
    };
  };

  /* --- solo --- */

  STEPS.needs = function () {
    // Team accounts skip this one \u2014 the answer only ever feeds the solo
    // branch's model recommendation, so asking it here would be collected
    // and then never read again.
    if (S.branch === "org") { nextAfterNeeds(); return; }
    say("What do you need the API for?");
    setChips(MODALITIES, true, null);
    say("Every box you leave unticked is a model I will not show you. Tick generously.");
    mode("both", "Something else? e.g. embeddings, re-ranking, translation");
    hint.textContent = "Tick what fits, or type what is missing.";
    setSkip(function () {
      me("Skipped");
      S.needs = "Chat & Reasoning (assumed)";
      S._mods = ["chat"];
      renderFacts("needs");
      bot(function (b) {
        card(b, null, "Chat and reasoning, then",
          "Safest guess, and it covers most first projects. Widen it later and the rest of the catalogue comes back.");
      });
      nextAfterNeeds();
    });
    send.onclick = function () {
      var labels = picked.map(function (p) { return p.label; });
      me(labels.join(" \u00b7 "));

  // Whose model it is, which is the mark people actually recognise \u2014 not the

  function vendorOf(m) {
    var id = m.id || "";
    if (/^nova/.test(id)) return "amazon";
    if (/^gpt/.test(id)) return "openai";
    if (/^gemini/.test(id)) return "google";
    if (/deepseek/.test(id)) return "deepseek";
    if (/kimi/.test(id)) return "moonshot";
    if (/claude/.test(id)) return "anthropic";
    return null;
  }

  function modelCard(m) {
    var c = el("button", "mcard");
    c.type = "button";
    c.setAttribute("aria-pressed", "false");

    var brand = el("span", "brand");
    brand.innerHTML = VENDOR_ICON[vendorOf(m)] || "";
    c.appendChild(brand);

    var mid = el("div");
    var nm = el("div", "nm");
    nm.appendChild(el("span", null, NICE[m.id] || m.id));
    // derived, not passed in: the badge states a fact about the model, so it
    // stays true wherever the card is rendered
    if (freeTier(m)) nm.appendChild(el("span", "tag", "Free test drive \u00b7 $10"));
    mid.appendChild(nm);
    c.appendChild(mid);

    var rd = el("span", "radio");
    rd.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"'
      + ' aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg>';
    c.appendChild(rd);

    c.addEventListener("click", function () {
      Array.prototype.forEach.call(streamIn.querySelectorAll(".mcard"), function (x) {
        x.setAttribute("aria-pressed", "false");
      });
      c.setAttribute("aria-pressed", "true");

  function commitOwn(text) {
    if (!text) return;

    box.value = "";

    var m = matchModel(text);
    if (m) {
      S.model = m.id; S._model = m;
      var tier = CEILING_TIERS.find(function (t) { return t >= m.out; });
      S.ceiling = tier ? "$" + tier + " / 1M output" : "None";
      renderFacts("model");
      say("Wiring up " + (NICE[m.id] || m.id) + " on " + m.label + ".");
      if (!freeTier(m)) {
        bot(function (b) {

            "The free $10 spends on the test-drive models only. Your key works either way \u2014 this model starts the moment you top up.");
        });
      }
    } else {
      S.model = text;
      S.ceiling = "$15 / 1M output";
      renderFacts("model");
      say("Noted \u2014 I will point the key at it.");

  function commitModel(m) {

  // their own message, still on screen — no re-listing, no articles to get

  var NEED_WORD = { speech: "speech", extract: "vision", research: "live search",

  // A coding tool ships whole files up on every turn; an agent loops in short
  // hops. Both are facts about the calls, which is what picks the model.
  var NEED_SHAPE = { tool: "a long context" };
  var WILL_SHAPE = { agent: "make a lot of short calls" };
  // the conclusion follows the workload first, because that is the actionable one
  var ENDINGS = [
    ["make a lot of short calls", "so price per call matters more here than peak quality"],
    ["run at volume", "so price per call matters more here than peak quality"],
    ["a long context", "so how much it can hold matters more than raw speed"]

  function joinWords(list) {
    if (list.length === 1) return list[0];

    say("Get Started is where you top up, and where the key is waiting.");
    setChips([], false); mode("none"); setSkip(null);
    hint.textContent = "End of the solo branch.";
  }

  function finishSolo() {
    setChips([], false); mode("none"); setSkip(null);
    hint.textContent = "Solo branch complete — 4 questions and one action.";
  }

  /* --- org (distinct questions only) --- */

  STEPS.orgPains = function () {
    bot(function (b) { b.appendChild(el("p", null, "Which of these resonate with you?")); });
    setChips(PAINS_ORG, true, null, null, true);
    mode("both", "Something else keeping you up? Type it.");
    hint.textContent = "Pick as many as apply, or type your own — each changes what I set up.";
    setSkip(function () {
      me("Skipped");
      S.worry = "Not said";
      renderFacts("worry");
      bot(function (b) { card(b, null, "Defaults it is", "A project limit and a fallback chain go on anyway. They cost nothing and they are what everyone asks for by month two."); });
      go("intro");
    });
    send.onclick = function () {
      var labels = picked.map(function (p) { return p.label; });
      me(labels.join(" · "));
      S.worry = labels.length > 2 ? labels.length + " things" : labels.join(", ");
      renderFacts("worry");
      bot(function (b) {
        picked.slice(0, 3).forEach(function (p) {
          var w = {
            spend:     ["amber", "Limits on org, project and key", "The tightest one wins, and an alert fires before it bites."],
            modelpick: [null, "A starter set, picked for you", "Filtered to what your team actually needs \u2014 the full catalogue stays one click away."],
            provider:  ["jade", "Fallback chain", "A second and a third model stand behind the first, inside your deadline."],
            access:    [null, "Roles per project, not per org", "Access follows the project boundary, so a contractor on one thing never sees another."],
            residency: [null, "Retention, ZDR and region controls", "Data stays where your policy says it stays, on every route we run."],
            scratch:   ["jade", "A clean default stack", "One key, one fallback chain, sane limits \u2014 nothing to migrate, nothing to unwind."]
          }[p.v];
          if (w) card(b, w[0], w[1], w[2]);
        });
      });
      go("intro");
    };
  };

  STEPS.orgName = function () {
    bot(function (b) { b.appendChild(el("p", null, "Name of your organization?")); });

    var guessed = orgNameFromEmail(DEMO_EMAIL);
    var nameOptions = [
      { v: "domain",  label: guessed, sub: "Based on your email domain" },
      { v: "default", label: "Default organization", sub: "You can rename it anytime" }
    ];

    function commitName(name) {
      S.orgName = name;
      renderFacts("orgName");
      go("orgTeamSize");
    }

    setChips(nameOptions, false, null, function (it) {
      me(it.label);
      commitName(it.label);
    }, false, 2);
    typedAsChip = false;
    mode("both", "Or type your own");
    hint.textContent = "Pick one, or type your own and press Continue.";

    // Typing is an answer too, so it clears whichever option was tapped \u2014
    // last action wins, same rule the model and role steps use.
    box.oninput = function () {
      if (box.value.trim() && chipsEl) {
        Array.prototype.forEach.call(chipsEl.children, function (x) {
          x.setAttribute("aria-pressed", "false");
        });
        picked = [];
      }
      send.disabled = box.value.trim().length === 0 && picked.length === 0;
    };

    send.onclick = function () {
      if (picked.length) { me(picked[0].label); commitName(picked[0].label); return; }
      var text = box.value.trim();
      if (!text) return;
      me(text);
      box.value = "";
      commitName(text);
    };

    setSkip(function () {
      me("Skipped");
      commitName(S.building || "Your organization");
    }, "Name it later");
  };

  STEPS.orgTeamSize = function () {
    bot(function (b) { b.appendChild(el("p", null, "How big is your team?")); });

    function commitTeamSize(label) {
      S.teamSize = label;
      renderFacts("teamSize");
      go("orgPains");
    }

    setChips([
      { v: "solo",  label: "Just me, for now" },
      { v: "small", label: "2 \u2013 5 Members" },
      { v: "mid",   label: "6 \u2013 20 Members" },
      { v: "large", label: "21 \u2013 50 Members" },
      { v: "xl",    label: "50+ Members" }
    ], false, null, function (it) {
      me(it.label);
      commitTeamSize(it.label);
    });
    typedAsChip = false;
    mode("both", "Or type it \u2014 e.g. \u201cabout 12 people\u201d");
    hint.textContent = "Pick one, or type it and press Continue.";

    // Typing is an answer too, so it clears whichever option was tapped \u2014
    // last action wins, same rule the other steps use.
    box.oninput = function () {
      if (box.value.trim() && chipsEl) {
        Array.prototype.forEach.call(chipsEl.children, function (x) {
          x.setAttribute("aria-pressed", "false");
        });
        picked = [];
      }
      send.disabled = box.value.trim().length === 0 && picked.length === 0;
    };

    send.onclick = function () {
      if (picked.length) { me(picked[0].label); commitTeamSize(picked[0].label); return; }
      var text = box.value.trim();
      if (!text) return;
      me(text);
      box.value = "";
      commitTeamSize(text);
    };

    setSkip(function () {
      me("Skipped");
      commitTeamSize("Not said");
    });
  };

  // Each closing line is a sentence plus an inline link — same voice as the
  // rest of the chat, but the second half is the clickable action.
  var CONFETTI_COLORS = ["#5b3df5", "#22c55e", "#f59e0b", "#ef4444", "#06b6d4", "#ec4899"];
  function fireConfetti() {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var layer = el("div", "confetti-layer");
    var n = 46;
    for (var i = 0; i < n; i++) {
      var p = el("div", "confetti-piece");
      p.style.left = (Math.random() * 100) + "%";
      p.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      p.style.setProperty("--drift", Math.round(Math.random() * 160 - 80) + "px");
      p.style.setProperty("--rot", (Math.round(Math.random() * 3 + 2) * 360) + "deg");
      p.style.animationDuration = (2.1 + Math.random() * 1.1) + "s";
      p.style.animationDelay = (Math.random() * 0.35) + "s";
      layer.appendChild(p);
    }
    document.body.appendChild(layer);
    setTimeout(function () { layer.remove(); }, 3600);
  }

  function closingLine(lead, actionLabel, dest) {
    bot(function (b) {
      var row = el("div", "closingline");
      row.appendChild(document.createTextNode(lead + " "));
      var lb = el("button", "linkbtn", actionLabel);
      lb.type = "button";
      lb.style.marginLeft = "0";
      lb.dataset.dest = dest;
      row.appendChild(lb);
      b.appendChild(row);
    });
  }

  STEPS.orgDone = function () {
    S.budget = "$500 / month";
    S.project = S.building || "first-project";
    S.key = KEY;
    renderFacts("project");
    bot(function (b) {
      fireConfetti();
      b.appendChild(el("p", null, "Congrats \u2014 your organization is created. What do you want to do next?"));
    });
    closingLine("Continue working with the LLM API.", "Go to the Get Started page", "getstarted");
    closingLine("Need more details first.", "Explore the Documentation", "docs");
    closingLine("Ready to start building.", "Create your API key", "apikeys");
    setChips([], false); mode("none"); setSkip(null);
    hint.textContent = "Org branch complete — 5 questions to a standing organization.";
  };


  /* ---------------- hero mosaic ---------------- */

  var cellsEl = document.getElementById("cells");

  // Banner mosaic: a shallow band of translucent tiles across the top, with a
  // few running down each edge so it frames the page instead of ending on a
  // line. Colours sampled off the reference — blue, through near-white, to
  // orchid and pink.
  var CELL = 76;
  var STOPS = [[92,138,217],[191,203,238],[227,226,244],[199,130,218],[232,160,203]];
  var MARK = [168, 85, 216];
  var FADE = 0.28, SIDE = 0.15, ALPHA = 0.78, DROPOUT = 0.46, SPARKLE = 0.12, MOVES = 0.45;

  function mix(t) {
    var n = STOPS.length - 1;
    var x = Math.max(0, Math.min(0.999999, t)) * n;
    var i = Math.floor(x), k = x - i;
    var a = STOPS[i], b = STOPS[i + 1];
    return [0, 1, 2].map(function (j) { return a[j] + (b[j] - a[j]) * k; });
  }
  function rgb(c, lift, jitter, a) {
    var p = c.map(function (v) { return Math.max(0, Math.min(255, Math.round(v + lift + jitter))); });
    return a === undefined || a >= 1 ? "rgb(" + p.join(",") + ")"
                                     : "rgba(" + p.join(",") + "," + a.toFixed(3) + ")";
  }

  function paintCells() {
    var w = window.innerWidth, h = window.innerHeight;
    var cols = Math.ceil(w / CELL), rows = Math.ceil(h / CELL);
    cellsEl.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    cellsEl.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
    var frag = document.createDocumentFragment();
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var d = document.createElement("div");
        d.className = "cell";

        var depth = rows > 1 ? r / (rows - 1) : 0;
        var cx = cols > 1 ? c / (cols - 1) : 0.5;
        var edge = Math.min(cx, 1 - cx);
        var fy = Math.max(0, 1 - depth / FADE);
        var fx = Math.max(0, 1 - edge / SIDE) * Math.max(0, 1 - depth * 0.9);
        var f = Math.max(fy * fy, fx * fx * 0.8);

        if (f <= 0.02 || Math.random() >= 1 - DROPOUT * (1 - f * 0.5)) {
          d.style.background = "transparent";
          d.classList.add("still");
          frag.appendChild(d);
          continue;
        }

        var base = mix(cx * 0.78 + depth * 0.22);
        var j = (Math.random() - 0.5) * 10;
        // a few tiles nearly solid, most ghosted — that unevenness is the look
        var a = Math.min(1, ALPHA * (0.45 + 0.55 * f) * (0.5 + Math.random() * 0.78));
        d.style.setProperty("--c1", rgb(base, 0, j, a));
        d.style.setProperty("--c2", rgb(base, 20, j, a));
        if (Math.random() > MOVES) d.classList.add("still");
        else d.style.setProperty("--dl", (-Math.random() * 10.5).toFixed(2) + "s");

        if (Math.random() < SPARKLE * f) {
          var m = document.createElement("i");
          m.style.background = rgb(MARK, 0, 0, Math.min(1, a + 0.42));
          d.appendChild(m);
        }
        frag.appendChild(d);
      }
    }
    cellsEl.textContent = "";
    cellsEl.appendChild(frag);
  }

  paintCells();
  var rs;
  window.addEventListener("resize", function () {
    clearTimeout(rs);
    rs = setTimeout(function () { if (!hero.hidden) paintCells(); }, 200);
  });

  /* ---------------- wiring ---------------- */

  document.getElementById("brandmark").innerHTML = LOGO;

  skipBtn.addEventListener("click", function () { if (stepSkip) stepSkip(); });

  // On a single-answer step the box IS the answer, so Continue follows it.
  box.addEventListener("input", function () {
    if (!typedAsChip) send.disabled = box.value.trim().length === 0 && picked.length === 0;
  });

  box.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.shiftKey) return;
    e.preventDefault();
    if (typedAsChip) {
      var t = box.value.trim();
      if (t) { addTyped(t); box.value = ""; }
    } else if (!inputrow.hidden) {
      send.click();
    }
  });

  // Registered before any step assigns send.onclick, so a half-typed answer is
  // absorbed rather than lost when they press Continue.
  send.addEventListener("click", function () {
    if (!typedAsChip) return;       // some steps read the box themselves
    var t = box.value.trim();
    if (!box.hidden && t) { addTyped(t); box.value = ""; }
  });

  // The cards select; Continue commits. One more click, but the choice stays
  // reversible while they are still reading the second card.
  var picks = Array.prototype.slice.call(document.querySelectorAll(".pick"));
  var heroGo = document.getElementById("heroGo");
  var chosen = null;

  function choose(elp, focus) {
    chosen = elp;
    picks.forEach(function (x) {
      var on = x === elp;
      x.setAttribute("aria-checked", on ? "true" : "false");
      x.tabIndex = on ? 0 : -1;   // one tab stop for the group, as a radiogroup should have
    });
    if (focus) elp.focus();
    heroGo.disabled = false;
  }
  picks.forEach(function (elp, i) {
    elp.setAttribute("aria-checked", "false");
    elp.addEventListener("click", function () { choose(elp); });
    elp.addEventListener("dblclick", function () { choose(elp); heroGo.click(); });
    elp.addEventListener("keydown", function (e) {
      var d = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1
            : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
      if (!d) return;
      e.preventDefault();
      choose(picks[(i + d + picks.length) % picks.length], true);
    });
  });
  heroGo.disabled = true;

  heroGo.addEventListener("click", function () {
    if (!chosen) return;
    openChat(chosen.dataset.label,
      { mode: chosen.dataset.mode, modeLabel: chosen.dataset.label, modalities: ["chat"], routes: [] }, null);
  });




  function resetHero() {
    chosen = null;
    picks.forEach(function (x) {
      x.setAttribute("aria-checked", "false");
      x.tabIndex = -1;
    });
    if (picks[0]) picks[0].tabIndex = 0;
    heroGo.disabled = true;
  }

  document.getElementById("heroSkip").addEventListener("click", function () {
    openChat(null, { mode: "solo", modalities: ["chat"], routes: [] }, null);
    setTimeout(handOverKey, 420);
  });

  function handOverKey() {
    queue.length = 0;
    streamIn.textContent = "";
    setChips([], false); mode("none"); setSkip(null);
    S = { branch: "solo", mode: "Just me", key: KEY, ceiling: "$5 / 1M output", model: "gpt-5-nano", credits: "$0.00" };
    renderFacts("key");
    bot(function (b) {
      b.appendChild(el("p", null, "Fair enough. Here it is."));
      var creds = el("div", "creds");
      credRow(creds, "Endpoint", ENDPOINT, false);
      credRow(creds, "API key", KEY, true);
      credRow(creds, "Model", "gpt-5-nano", false);
      b.appendChild(creds);
      b.appendChild(el("p", "sub", "Default project, a $5 price ceiling, a $50 monthly cap. Skipping the conversation never skips the guardrails — a key with none of them is exactly how a surprise bill starts."));
    });
    hint.textContent = "";
  }

  document.getElementById("skip").addEventListener("click", handOverKey);

  function resetAll() {
    streamIn.textContent = ""; S = {}; picked = [];
    queue.length = 0; playing = false; composer.classList.remove("busy");
    send.onclick = null;
    app.hidden = true;
    hero.hidden = false;
    requestAnimationFrame(function () { hero.classList.remove("out"); });
    resetHero();
    renderFacts();
    window.scrollTo(0, 0);
  }

  document.getElementById("restart").addEventListener("click", resetAll);
  // Same exit as "Start over", just always reachable from the corner.
  document.getElementById("closeOnboarding").addEventListener("click", resetAll);

  renderFacts();
})();

</script>

</body></html>
